<style>
  :root{
    --paper:#F3EFE4;
    --paper-raised:#FAF8F1;
    --ink:#1B2540;
    --ink-soft:#5A5F6E;
    --ink-faint:#8890A3;
    --rule:#DDD6C4;
    --rule-strong:#C9C0A8;
    --accent:#C0602E;
    --accent-dark:#A04A2E;
    --flag:#6B7F5E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:24px;
  }
  .card{
    max-width:560px;
    text-align:center;
  }
  .brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:44px;
  }
  .brand .mark{
    width:22px;height:22px;
    border-radius:5px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-style:italic;
    font-size:13px;
    color:#F3DFCF;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent-dark);
    font-weight:600;
    display:block;
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:38px;
    line-height:1.2;
    margin:0 0 16px;
  }
  h1 em{font-style:italic;font-weight:600;color:var(--accent);}
  p{
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0 0 36px;
  }
  .links{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:13px 22px;
    border-radius:5px;
    text-decoration:none;
    display:inline-block;
  }
  .btn-solid{background:var(--ink);color:var(--paper);}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--rule-strong);}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent-dark);}
  .not-found-num{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:700;
    font-size:15px;
    color:var(--flag);
    display:block;
    margin-top:40px;
  }
</style>

<body>
  <div class="card">
    <a href="index.html" class="brand">
      <span class="mark">A</span>
      AI REFERRAL SCORING
    </a>
    <span class="eyebrow">404</span>
    <h1>This page didn't <em>make the cut</em>.</h1>
    <p>Whatever you were looking for isn't here — maybe a broken link, maybe a typo. Here's where the real content lives.</p>
    <div class="links">
      <a href="index.html" class="btn btn-solid">Go to overview</a>
      <a href="paper.html" class="btn btn-outline">Read the paper</a>

    <span class="not-found-num">— not confirmed, page-wise</span>
  </div>
